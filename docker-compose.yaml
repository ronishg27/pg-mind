services:
    postgres:
        image: postgres:17
        container_name: pgmind-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: pgmind_dev
            POSTGRES_USER: pgmind
            POSTGRES_PASSWORD: pgmind_dev_password
        ports:
            - "5433:5432"
        volumes:
            - pgmind_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U pgmind -d pgmind_dev"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    pgmind_pgdata:
