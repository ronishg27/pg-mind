services:
    postgres:
        image: postgres:17
        container_name: querymind-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: querymind_dev
            POSTGRES_USER: querymind
            POSTGRES_PASSWORD: querymind_dev_password
        ports:
            - "5433:5432"
        volumes:
            - querymind_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U querymind -d querymind_dev"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    querymind_pgdata:
